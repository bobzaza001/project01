{% extends 'base.html' %}
{% block title %}ลืมรหัสผ่าน — ระบบยืม-คืนครุภัณฑ์{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1>ลืมรหัสผ่าน</h1>
            <p>กรอกอีเมลที่ใช้สมัครสมาชิกเพื่อรีเซ็ตรหัสผ่าน</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> อีเมล
                </label>
                <input type="email" id="email" name="email" placeholder="กรอกอีเมลที่ใช้สมัครสมาชิก" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <span class="btn-text">ส่งลิงก์รีเซ็ตรหัสผ่าน</span>
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a></p>
        </div>
    </div>
</div>
{% endblock %}

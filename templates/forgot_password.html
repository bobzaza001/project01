{% extends 'base.html' %}
{% block title %}กู้คืนบัญชีผู้ใช้ — ระบบยืม-คืนครุภัณฑ์{% endblock %}
{% block content %}
<div class="auth-wrapper fade-in">
    <div class="auth-card" style="max-width: 480px; width: 100%;">
        <div class="auth-header">
            <div class="auth-icon" style="width: 60px; height: 60px; border-radius: 50%; background: var(--gradient-btn); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.5rem; color: white;">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1>ศูนย์กู้คืนบัญชี</h1>
            <p>ค้นหาชื่อผู้ใช้ หรือ ตั้งรหัสผ่านใหม่</p>
        </div>

        <!-- แท็บสลับ ค้นหา User / ตั้งรหัสผ่านใหม่ -->
        <div style="display: flex; gap: 8px; margin-bottom: 1.5rem; background: var(--bg-surface); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border);">
            <button type="button" id="tabFindUser" onclick="switchRecoveryTab('find_user')" style="flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s ease; background: var(--gradient-btn); color: white;">
                <i class="fas fa-search"></i> ค้นหาชื่อผู้ใช้
            </button>
            <button type="button" id="tabResetPass" onclick="switchRecoveryTab('reset_password')" style="flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s ease; background: transparent; color: var(--text-secondary);">
                <i class="fas fa-key"></i> ตั้งรหัสผ่านใหม่
            </button>
        </div>

        <!-- แบบฟอร์ม 1: ค้นหาชื่อผู้ใช้ -->
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" id="formFindUser" class="auth-form">
            <input type="hidden" name="action_type" value="find_user">
            
            <div class="form-group">
                <label for="find_email">
                    <i class="fas fa-envelope"></i> อีเมลสถาบัน (.ac.th) ที่ใช้ลงทะเบียน
                </label>
                <input type="email" id="find_email" name="email" placeholder="เช่น 68302040047@atcc.ac.th" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-search"></i> ค้นหาชื่อผู้ใช้ / รหัสนักศึกษา
            </button>
        </form>

        <!-- แบบฟอร์ม 2: ตั้งรหัสผ่านใหม่ (ซ่อนเริ่มต้น) -->
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" id="formResetPass" class="auth-form" style="display: none;">
            <input type="hidden" name="action_type" value="reset_password">
            
            <div class="form-group">
                <label for="reset_email">
                    <i class="fas fa-envelope"></i> อีเมลสถาบัน (.ac.th)
                </label>
                <input type="email" id="reset_email" name="email" placeholder="กรอกอีเมลสถาบันเพื่อยืนยันตัวตน" required>
            </div>

            <div class="form-group">
                <label for="new_password">
                    <i class="fas fa-lock"></i> รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)
                </label>
                <input type="password" id="new_password" name="new_password" placeholder="กรอกรหัสผ่านใหม่" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirm_new_password">
                    <i class="fas fa-lock"></i> ยืนยันรหัสผ่านใหม่
                </label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="background: linear-gradient(135deg, #10b981, #059669);">
                <i class="fas fa-check-circle"></i> บันทึกรหัสผ่านใหม่
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a></p>
        </div>
    </div>
</div>

<script>
function switchRecoveryTab(mode) {
    const tabFind = document.getElementById('tabFindUser');
    const tabReset = document.getElementById('tabResetPass');
    const formFind = document.getElementById('formFindUser');
    const formReset = document.getElementById('formResetPass');

    if (mode === 'find_user') {
        tabFind.style.background = 'var(--gradient-btn)';
        tabFind.style.color = 'white';
        tabReset.style.background = 'transparent';
        tabReset.style.color = 'var(--text-secondary)';
        
        formFind.style.display = 'block';
        formReset.style.display = 'none';
    } else {
        tabReset.style.background = 'var(--gradient-btn)';
        tabReset.style.color = 'white';
        tabFind.style.background = 'transparent';
        tabFind.style.color = 'var(--text-secondary)';
        
        formFind.style.display = 'none';
        formReset.style.display = 'block';
    }
}
</script>
{% endblock %}

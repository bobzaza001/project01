{% extends 'base.html' %}
{% block title %}เพิ่มอุปกรณ์ใหม่ — ระบบยืม-คืนครุภัณฑ์{% endblock %}
{% block content %}
<div class="admin-form-wrapper fade-in">
    <div class="admin-form-card">
        <h1><i class="fas fa-plus-circle"></i> เพิ่มอุปกรณ์ใหม่</h1>
        <p>กรอกข้อมูลและอัปโหลดรูปภาพสำหรับอุปกรณ์ใหม่</p>
        
        <form method="POST" action="{{ url_for('admin.add_equipment') }}" enctype="multipart/form-data" class="auth-form" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="name">ชื่ออุปกรณ์</label>
                <input type="text" id="name" name="name" required placeholder="เช่น Laptop Dell XPS 13">
            </div>
            
            <div class="form-group">
                <label for="equipment_code">รหัสอุปกรณ์</label>
                <input type="text" id="equipment_code" name="equipment_code" required placeholder="เช่น EQ-005">
            </div>
            
            <div class="form-group">
                <label for="description">รายละเอียด</label>
                <textarea id="description" name="description" rows="3" placeholder="คำอธิบายเพิ่มเติม..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="total_quantity">จำนวนทั้งหมด</label>
                <input type="number" id="total_quantity" name="total_quantity" min="1" value="1" required>
            </div>
            
            <div class="form-group">
                <label for="room_id">สถานที่ / ห้อง</label>
                <select id="room_id" name="room_id" class="purpose-input">
                    <option value="">-- ไม่ระบุ --</option>
                    {% for b in buildings %}
                        <optgroup label="อาคาร: {{ b.name }}">
                        {% for f in b.floors %}
                            {% for r in f.rooms %}
                                <option value="{{ r.id }}">ชั้น {{ f.name }} - ห้อง {{ r.name }}</option>
                            {% endfor %}
                        {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; justify-content: flex-start;">
                    <input type="checkbox" name="is_borrowable" value="yes" checked style="width: 20px; height: 20px; accent-color: #8b5cf6;">
                    <span style="color: var(--text-primary); font-size: 0.95rem;">อนุญาตให้ผู้ใช้ยืมออกนอกสถานที่ได้</span>
                </label>
            </div>
            
            <div class="form-group">
                <label>อัปโหลดรูปภาพ</label>
                <label for="image" class="file-upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>คลิกเพื่อเลือกไฟล์ (JPG, PNG, WEBP)</p>
                    <input type="file" id="image" name="image" accept="image/*" style="display: none;" onchange="previewImage(this)">
                </label>
                <div class="image-preview" id="imagePreviewContainer">
                    <img id="imagePreview" src="#" alt="Preview">
                </div>
            </div>
            
            <div class="form-options" style="margin-top: 1rem;">
                <a href="{{ url_for('user.dashboard') }}" class="btn btn-warning" style="width: auto;">
                    <i class="fas fa-arrow-left"></i> ยกเลิก
                </a>
                <button type="submit" class="btn btn-primary" style="flex: 1; margin-left: 1rem;">
                    <i class="fas fa-save"></i> บันทึกข้อมูล
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function previewImage(input) {
    if (input.files && input.files[0]) {
        let file = input.files[0];
        if (file.type.startsWith('image/') && file.size > 500 * 1024) {
            file = await compressImageFile(file);
            if (window.DataTransfer) {
                const dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
            }
        }
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('imagePreviewContainer').style.display = 'block';
        }
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}

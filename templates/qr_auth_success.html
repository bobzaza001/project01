{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบบนคอมพิวเตอร์สำเร็จ{% endblock %}
{% block content %}
<div class="auth-wrapper fade-in" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="auth-card" style="max-width: 440px; width: 100%; text-align: center; padding: 2.5rem 2rem; border-radius: 24px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(16, 185, 129, 0.4); box-shadow: 0 20px 50px rgba(0,0,0,0.6);">
        
        <div style="background: rgba(16, 185, 129, 0.15); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; color: #10b981; font-size: 2.5rem; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);">
            <i class="fas fa-check"></i>
        </div>

        <h2 style="font-size: 1.4rem; color: #fff; margin: 0 0 0.5rem 0; font-weight: 700;">
            เข้าสู่ระบบสำเร็จแล้ว!
        </h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.8rem; line-height: 1.4;">
            หน้าจอคอมพิวเตอร์ของคุณได้รับการอนุญาตและเข้าสู่ระบบในชื่อ <strong style="color: #38bdf8;">{{ user.full_name }}</strong> เรียบร้อยแล้ว
        </p>

        <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary btn-full" style="padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-home"></i> กลับสู่หน้าหลักบนมือถือ
        </a>
    </div>
</div>
{% endblock %}

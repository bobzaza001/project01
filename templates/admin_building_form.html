{% extends 'base.html' %}
{% block title %}{{ 'แก้ไขอาคาร' if building else 'เพิ่มอาคารใหม่' }} — ระบบยืม-คืนครุภัณฑ์{% endblock %}

{% block content %}
<div class="admin-form-wrapper fade-in" style="max-width: 600px; margin: 2rem auto;">
    <div class="admin-form-card" style="padding: 2rem; border-radius: 20px; background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(255,255,255,0.1);">
        
        <div style="display: flex; align-items: center; margin-bottom: 2rem;">
            <a href="{{ url_for('admin.manage_locations') }}" class="btn btn-secondary btn-sm" style="margin-right: 15px;">
                <i class="fas fa-arrow-left"></i> กลับ
            </a>
            <h1 style="margin: 0; font-size: 1.5rem;"><i class="fas {{ 'fa-edit' if building else 'fa-building' }}"></i> {{ 'แก้ไขชื่ออาคาร' if building else 'เพิ่มอาคารใหม่' }}</h1>
        </div>
        
        <form method="POST" action="{{ url_for('admin.edit_building', b_id=building.id) if building else url_for('admin.add_building') }}" class="auth-form">
            <div class="form-group">
                <label>ชื่ออาคาร</label>
                <input type="text" name="name" required class="purpose-input" placeholder="เช่น อาคารเรียนรวม 1, อาคารวิทยาศาสตร์" value="{{ building.name if building else '' }}">
            </div>
            
            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-{{ 'warning' if building else 'primary' }} btn-full">
                    <i class="fas fa-save"></i> บันทึกข้อมูล
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
